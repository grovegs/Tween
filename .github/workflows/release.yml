name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: "Select the version to increment (major, minor, patch)"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    name: Release Package
    uses: grovegs/workflows/.github/workflows/package-release.yml@v1.3.6
    with:
      package-name: Tween
      version-type: ${{ inputs.version-type }}
      runs-on: ubuntu-latest
      dotnet-project: src/GroveGames.Tween
      global-json-file: global.json
      directory-build-props: Directory.Build.props
      readme-file: README.md
      license-file: LICENSE
      godot-addon: src/GroveGames.Tween.Godot/addons/GroveGames.Tween
      create-tag: true
      publish-github: true
      publish-nuget: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      client-id: ${{ secrets.CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
      nuget-api-key: ${{ secrets.NUGET_API_KEY }}
