name: 🧪 Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  core-tests:
    uses: grovegs/workflows/.github/workflows/package-tests.yml@v1.3.0
    with:
      dotnet-project: tests/GroveGames.Tween.Tests
      global-json-file: global.json

  godot-tests:
    uses: grovegs/workflows/.github/workflows/package-tests.yml@v1.3.0
    with:
      dotnet-project: tests/GroveGames.Tween.Godot.Tests
      global-json-file: global.json
